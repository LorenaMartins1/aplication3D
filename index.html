<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Visualização 3D Básica</title>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { display: block; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/three@0.145.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.145.0/examples/js/controls/OrbitControls.js"></script>

</head>
<body>
  <script>
    window.onload = function () {
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x202020);

      const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.z = 5;

      const renderer = new THREE.WebGLRenderer();
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      const light = new THREE.DirectionalLight(0xffffff, 1);
      light.position.set(5, 5, 5);
      scene.add(light);

      // Cubo lilás
      const cubeGeometry = new THREE.BoxGeometry();
      const cubeMaterial = new THREE.MeshPhongMaterial({ color: 0x8B5FBF });
      const cube = new THREE.Mesh(cubeGeometry, cubeMaterial);
      cube.position.x = -2;
      scene.add(cube);

    // Esfera cinza claro
      const sphereGeometry = new THREE.SphereGeometry(0.7, 32, 32);
      const sphereMaterial = new THREE.MeshPhongMaterial({ color: 0xD3D3D3 });
      const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
      scene.add(sphere);


      // Cilindro azul
      const cylinderGeometry = new THREE.CylinderGeometry(0.5, 0.5, 1.5, 32);
      const cylinderMaterial = new THREE.MeshPhongMaterial({ color: 0x0000ff });
      const cylinder = new THREE.Mesh(cylinderGeometry, cylinderMaterial);
      cylinder.position.x = 2;
      scene.add(cylinder);

      // Controles de câmera
      const controls = new THREE.OrbitControls(camera, renderer.domElement);

      // Animação
      function animate() {
        requestAnimationFrame(animate);
        cube.rotation.x += 0.01;
        cube.rotation.y += 0.01;
        cylinder.scale.y = 1 + 0.3 * Math.sin(Date.now() * 0.002);
        renderer.render(scene, camera);
      }

      animate();

      // Responsividade
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    };
  </script>
</body>
</html>
